name: Publish to NuGet.org (Trusted Publishing)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (e.g. 1.0.0)"
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run Tests
        run: dotnet test -c Release

      - name: Pack NuGet Package
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF_NAME#v}"
            else
              VERSION="1.0.0"
            fi
          fi
          echo "Building package version: $VERSION"
          dotnet pack -c Release -o ./nupkg /p:PackageVersion="$VERSION"

      - name: Authenticate to NuGet.org via Trusted Publishing (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: chneau

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
